cu_cp:
  amf:
    addr: 10.53.1.2
    port: 38412
    bind_addr: 10.53.1.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

  inactivity_timer: 7200
  request_pdu_session_timeout: 5

  mobility:
    trigger_handover_from_measurements: true

    cells:
      - nr_cell_id: 0x19B0
        gnb_id_bit_length: 22
        pci: 1
        band: 3
        ssb_arfcn: 368410
        ssb_scs: 15
        ssb_period: 20
        ssb_offset: 0
        ssb_duration: 1
        periodic_report_cfg_id: 1
        ncells:
          - nr_cell_id: 0x19B1
            report_configs: [2]

      - nr_cell_id: 0x19B1
        gnb_id_bit_length: 22
        pci: 2
        band: 3
        ssb_arfcn: 368410
        ssb_scs: 15
        ssb_period: 20
        ssb_offset: 0
        ssb_duration: 1
        periodic_report_cfg_id: 1
        ncells:
          - nr_cell_id: 0x19B0
            report_configs: [2]

    report_configs:
      - report_cfg_id: 1
        report_type: periodical
        report_interval_ms: 1024

      - report_cfg_id: 2
        report_type: event_triggered
        event_triggered_report_type: a3
        meas_trigger_quantity: rsrp
        meas_trigger_quantity_offset_db: 3
        hysteresis_db: 0
        time_to_trigger_ms: 100

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7

  pdcch:
    common:
      ss0_index: 0
      coreset0_index: 12
    dedicated:
      ss2_type: ue_dedicated
      dci_format_0_1_and_1_1: true

  prach:
    prach_config_index: 1

  pdsch:
    mcs_table: qam64

  pusch:
    mcs_table: qam64
    min_ue_mcs: 0
    max_ue_mcs: 28

cells:
  - pci: 1
    dl_arfcn: 368500
    prach:
      prach_root_sequence_index: 0

  - pci: 2
    dl_arfcn: 368500
    prach:
      prach_root_sequence_index: 64

log:
  filename: /home/mourad6g/logs/srsgnb.log
  all_level: info
  hex_max_size: 0

pcap:
  mac_enable: true
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: true
  ngap_filename: /tmp/gnb_ngap.pcap
  e2ap_enable: true
  e2ap_du_filename: /tmp/gnb_du_e2ap.pcap
  e2ap_cu_cp_filename: /tmp/gnb_cu_cp_e2ap.pcap
  e2ap_cu_up_filename: /tmp/gnb_cu_up_e2ap.pcap

e2:
  enable_du_e2: true
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true
  addr: 10.0.2.10
  bind_addr: 10.0.2.1
  port: 36421

metrics:
  layers:
    enable_rlc: true
    enable_sched: true
    enable_app_usage: true
    enable_e1ap: true
    enable_pdcp: true
    enable_mac: true
    enable_executor: false
    enable_du_low: true
    enable_ru: true
  periodicity:
    du_report_period: 1000
  autostart_stdout_metrics: true
  enable_json: true

remote_control:
  bind_addr: 0.0.0.0
  enabled: true
