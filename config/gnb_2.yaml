ran_node_name: cu_cp_01             # Sets the text ID associated with the gNB. Format: string without spaces.
gnb_id: 411                         # Sets the numerical ID associated with the gNB.
gnb_id_bit_length: 22               # Sets the bit length of the gnb_id above. Format: integer between [22 - 32]
gnb_cu_up_id: 0                     # Sets the gNB CU-UP ID.
gnb_du_id: 0                        # Sets the gNB DU ID.

cu_cp:
  amf:
    addr: 10.53.1.2                 # The address or hostname of the AMF.
    port: 38412
    bind_addr: 10.53.1.1            # A local IP that the gNB binds to for traffic from the AMF.
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200            # Sets the UE/PDU Session/DRB inactivity timer to 7200 seconds. Supported: [1 - 7200].

ru_sdr:
  device_driver: zmq                # The RF driver name.
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6 # Optionally pass arguments to the selected RF driver.
  srate: 23.04                                                  # RF sample rate might need to be adjusted according to selected bandwidth.
  tx_gain: 79                                                  # Transmit gain of the RF might need to adjusted to the given situation.
  rx_gain: 60                                                   # Receive gain of the RF might need to adjusted to the given situation.

cell_cfg:
  dl_arfcn: 632628                                                # ARFCN of the downlink carrier (center frequency).
  band: 78                                                        # The NR band.
  channel_bandwidth_MHz: 20                                       # Bandwith in MHz. Number of PRBs will be automatically derived.
  common_scs: 30                                                  # Subcarrier spacing in kHz used for data.
  plmn: "00101"                                                   # PLMN broadcasted by the gNB.
  tac: 7                                                          # Tracking area code (needs to match the core configuration).
  pci: 1           
  slicing:
    - sst: 1
      sd: 1                                             # Physical cell ID.
  pdcch:
    common:
      ss0_index: 0                  # Set search space zero index to match srsUE capabilities
      coreset0_index: 12             # Set search CORESET Zero index to match srsUE capabilities
    dedicated:
      ss2_type: ue_dedicated   #ue_dedicated           # Search Space type, has to be set to common
      dci_format_0_1_and_1_1: true # Set correct DCI format (fallback)
  nof_antennas_dl: 1
  nof_antennas_ul: 1
  ssb:
    ssb_period: 10
  pdsch:
    mcs_table: qam256
log:
  filename: /home/mourad6g/logs/srsgnb.log            # Path of the log file.
  all_level: info                   # Logging level applied to all layers.
  hex_max_size: 0

pcap:
  mac_enable: true                 # Set to true to enable MAC-layer PCAPs.
  mac_filename: /tmp/gnb_mac.pcap   # Path where the MAC PCAP is stored.
  ngap_enable: true                # Set to true to enable NGAP PCAPs.
  ngap_filename: /tmp/gnb_ngap.pcap # Path where the NGAP PCAP is stored.
  e2ap_enable: true                 # Set to true to enable E2AP PCAPs.
  e2ap_du_filename: /tmp/gnb_du_e2ap.pcap        # Path where the DU E2AP PCAP is stored.
  e2ap_cu_cp_filename: /tmp/gnb_cu_cp_e2ap.pcap  # Path where the CU-CP E2AP PCAP is stored.
  e2ap_cu_up_filename: /tmp/gnb_cu_up_e2ap.pcap  # Path where the CU-UP E2AP PCAP is stored.

e2:
  enable_du_e2: true                # Enable DU E2 agent (one for each DU instance)
  enable_cu_cp_e2: false            # Enables the CU E2 agent for CU-CP
  enable_cu_up_e2: false            # Enables the CU E2 agent for CU-UP
  e2sm_kpm_enabled: true            # Enable KPM service module
  e2sm_rc_enabled: true             # Enable RC service module
  e2sm_ccc_enabled: true            # Enable CCC service module
  addr: 10.0.2.10                   # RIC IP address
  bind_addr: 10.0.2.1               # A local IP that the E2 agent binds to for traffic from the RIC. ONLY required if running the RIC on a separate machine. 
  port: 36421                       # RIC port

metrics:
  autostart_stdout_metrics: true
  enable_log: true
  enable_json: true

  periodicity:
    du_report_period: 1000
    cu_up_report_period: 1000
    cu_cp_report_period: 1000

  layers:
    enable_rlc: true                # Enable RLC metrics
    enable_sched: true              # Enable DU scheduler metrics
    enable_app_usage: true      # Enable application usage metrics
    enable_e1ap: true           # Enable E1AP metrics
    enable_pdcp: true           # Enable PDCP metrics
    enable_sched: true          # Enable DU scheduler metrics
    enable_rlc: true            # Enable RLC metrics
    enable_mac: true            # Enable MAC metrics
    enable_executor: false       # Enable DU-high executor metrics
    enable_du_low: true         # Enable DU low metrics (upper physical layer)
    enable_ru: true             # Enable Radio Unit metrics

